[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-qa-api"
version = "0.1.0"
description = "REST API RAG service for question answering over uploaded tech docs."
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "openai>=1.50.0",
    "chromadb>=0.5.0",
    "pypdf>=5.0.0",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "mypy>=1.10.0",
    "ruff>=0.17.3",
]

[tool.uv]
default-groups = ["dev"]
# The lockfile is universal. Require a resolution that also installs on Intel Macs
# (some wheels, e.g. onnxruntime, dropped macosx x86_64 in newer releases).
required-environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64'"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "D"]
# PROJECT_RULES.md requires docstrings on functions, methods, and classes, not on modules.
ignore = ["D100"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
